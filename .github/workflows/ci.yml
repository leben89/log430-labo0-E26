jobs:
  # Le job de build peut rester sur les serveurs de GitHub pour économiser vos ressources
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python -m pytest

  # Le job de déploiement DOIT s'exécuter sur votre serveur fiware-1
  deploy:
    needs: build
    runs-on: self-hosted  # <--- C'est ici que vous faites le changement
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Run Docker
        run: |
          docker build -t calculator .
          docker stop calculator || true
          docker rm calculator || true
          docker run -d --name calculator calculator