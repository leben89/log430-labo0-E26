name: CI_CD_Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Labo0

    steps:
      - name: Checkout dépôt
        uses: actions/checkout@v3

      - name: Créer fichier .env
        run: |
          echo "CALCULATOR_USERNAME=GithubActions" >> .env

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Exécuter les tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout dépôt
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t calculator .

      - name: Stop ancien container
        run: docker stop calculator || true

      - name: Supprimer ancien container
        run: docker rm calculator || true

      - name: Lancer nouveau container
        run: docker run -d --name calculator calculator