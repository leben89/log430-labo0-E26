name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t calculator .

      - name: Stop old container
        run: docker stop calculator || true

      - name: Remove old container
        run: docker rm calculator || true

      - name: Run new container
        run: docker run -d --name calculator calculator